                <div className="bg-white p-4 rounded-lg shadow">
                  <h2 className="text-lg font-semibold mb-2">Key Statistics</h2>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-blue-50 p-2 rounded">
                      <p className="text-sm text-gray-600">Total Check-ins</p>
                      <p className="text-xl font-bold">{keyStats[activeMonth].totalCheckIns}</p>
                    </div>
                    <div className="bg-green-50 p-2 rounded">
                      <p className="text-sm text-gray-600">Average Daily</p>
                      <p className="text-xl font-bold">{keyStats[activeMonth].dailyAverage}</p>
                    </div>
                    <div className="bg-yellow-50 p-2 rounded">
                      <p className="text-sm text-gray-600">Peak Day</p>
                      <p className="text-xl font-bold">{keyStats[activeMonth].peakDay}</p>
                    </div>
                    <div className="bg-purple-50 p-2 rounded">
                      <p className="text-sm text-gray-600">Busiest Day</p>
                      <p className="text-xl font-bold">{keyStats[activeMonth].busiestDay}</p>
                    </div>
                  </div>
                </div>
                
                <div className="bg-white p-4 rounded-lg shadow">
                  <h2 className="text-lg font-semibold mb-2">Dispatcher Distribution</h2>
                  <ResponsiveContainer width="100%" height={200}>
                    <PieChart>
                      <Pie
                        data={dispatcherData}
                        cx="50%"
                        cy="50%"
                        labelLine={false}
                        outerRadius={80}
                        fill="#8884d8"
                        dataKey="value"
                        label={({name, percent}) => `${name}: ${(percent * 100).toFixed(0)}%`}
                      >
                        {dispatcherData.map((entry, index) => (
                          <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                        ))}
                      </Pie>
                      <Tooltip />
                    </PieChart>
                  </ResponsiveContainer>
                </div>
              </div>
            </div>
          )}
          
          {/* Carriers Tab */}
          {activeTab === 'carriers' && (
            <div>
              <div className="bg-white p-4 rounded-lg shadow mb-4">
                <h2 className="text-lg font-semibold mb-2">Carrier Distribution</h2>
                <ResponsiveContainer width="100%" height={300}>
                  <PieChart>
                    <Pie
                      data={carrierDistribution}
                      cx="50%"
                      cy="50%"
                      labelLine={true}
                      outerRadius={100}
                      fill="#8884d8"
                      dataKey="value"
                      label={({name, value}) => `${name}: ${value} (${((value/keyStats[activeMonth].totalCheckIns)*100).toFixed(1)}%)`}
                    >
                      {carrierDistribution.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                      ))}
                    </Pie>
                    <Tooltip />
                  </PieChart>
                </ResponsiveContainer>
              </div>
              
              <div className="bg-white p-4 rounded-lg shadow mb-4">
                <h2 className="text-lg font-semibold mb-2">Daily Check-ins by Carrier</h2>
                <ResponsiveContainer width="100%" height={400}>
                  <BarChart data={dailyCheckIns}>
                    <CartesianGrid strokeDasharray="3 3" />
                    <XAxis dataKey="date" />
                    <YAxis />
                    <Tooltip />
                    <Legend />
                    <Bar dataKey="FMXH" fill="#0088FE" />
                    <Bar dataKey="SVLD" fill="#00C49F" />
                    <Bar dataKey="SIET" fill="#FFBB28" />
                    <Bar dataKey="FSEO" fill="#FF8042" />
                    <Bar dataKey="TSVO" fill="#8884d8" />
                    <Bar dataKey="AIBL" fill="#82ca9d" />
                    {activeMonth === 'february' ? 
                      <Bar dataKey="NOED" fill="#ffc658" /> : 
                      <Bar dataKey="GMRL" fill="#ffc658" />
                    }
                  </BarChart>
                </ResponsiveContainer>
              </div>
              
              <div className="bg-white p-4 rounded-lg shadow">
                <h2 className="text-lg font-semibold mb-2">Carrier Insights</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <h3 className="text-md font-medium mb-1">Peak Days by Carrier</h3>
                    <ul className="text-sm">
                      {carrierInsights[activeMonth].peakDays.map((item, index) => (
                        <li key={index} className="mb-1">
                          <span className="font-semibold">{item.carrier}:</span> {item.peak}
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div>
                    <h3 className="text-md font-medium mb-1">Common Check-in Notes</h3>
                    <ul className="text-sm">
                      {carrierInsights[activeMonth].notes.map((item, index) => (
                        <li key={index} className="mb-1">
                          <span className="font-semibold">{item.carrier}:</span> {item.note}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          )}
          
          {/* Hourly Patterns Tab */}
          {activeTab === 'hourly' && (
            <div>
              <div className="bg-white p-4 rounded-lg shadow mb-4">
                <h2 className="text-lg font-semibold mb-2">Hourly Check-in Distribution</h2>
                <ResponsiveContainer width="100%" height={300}>
                  <BarChart data={hourlyCheckIns}>
                    <CartesianGrid strokeDasharray="3 3" />
                    <XAxis dataKey="hour" />
                    <YAxis />
                    <Tooltip />
                    <Legend />
                    <Bar dataKey="total" fill="#8884d8" />
                  </BarChart>
                </ResponsiveContainer>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div className="bg-white p-4 rounded-lg shadow">
                  <h2 className="text-lg font-semibold mb-2">Peak Check-in Hours</h2>
                  <div className="overflow-x-auto">
                    <table className="min-w-full">
                      <thead>
                        <tr>
                          <th className="text-left p-2 bg-gray-100">Hour</th>
                          <th className="text-left p-2 bg-gray-100">Check-ins</th>
                          <th className="text-left p-2 bg-gray-100">% of Total</th>
                        </tr>
                      </thead>
                      <tbody>
                        {activeMonth === 'february' ? (
                          <React.Fragment>
                            <tr>
                              <td className="p-2 border-b">1 PM</td>
                              <td className="p-2 border-b">47</td>
                              <td className="p-2 border-b">9.8%</td>
                            </tr>
                            <tr>
                              <td className="p-2 border-b">8 AM</td>
                              <td className="p-2 border-b">46</td>
                              <td className="p-2 border-b">9.6%</td>
                            </tr>
                            <tr>
                              <td className="p-2 border-b">10 PM</td>
                              <td className="p-2 border-b">38</td>
                              <td className="p-2 border-b">7.9%</td>
                            </tr>
                            <tr>
                              <td className="p-2 border-b">12 PM</td>
                              <td className="p-2 border-b">36</td>
                              <td className="p-2 border-b">7.5%</td>
                            </tr>
                            <tr>
                              <td className="p-2">9 PM</td>
                              <td className="p-2">35</td>
                              <td className="p-2">7.3%</td>
                            </tr>
                          </React.Fragment>
                        ) : (
                          <React.Fragment>
                            <tr>
                              <td className="p-2 border-b">10 PM</td>
                              <td className="p-2 border-b">52</td>
                              <td className="p-2 border-b">9.1%</td>
                            </tr>
                            <tr>
                              <td className="p-2 border-b">1 PM</td>
                              <td className="p-2 border-b">50</td>
                              <td className="p-2 border-b">8.8%</td>
                            </tr>
                            <tr>
                              <td className="p-2 border-b">9 PM</td>
                              <td className="p-2 border-b">45</td>
                              <td className="p-2 border-b">7.9%</td>
                            </tr>
                            <tr>
                              <td className="p-2 border-b">12 PM</td>
                              <td className="p-2 border-b">42</td>
                              <td className="p-2 border-b">7.4%</td>
                            </tr>
                            <tr>
                              <td className="p-2">8 AM</td>
                              <td className="p-2">38</td>
                              <td className="p-2">6.7%</td>
                            </tr>
                          </React.Fragment>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
                
                <div className="bg-white p-4 rounded-lg shadow">
                  <h2 className="text-lg font-semibold mb-2">Carrier Peak Hours</h2>
                  <ul className="space-y-2">
                    <li className="flex justify-between items-center">
                      <span className="font-medium">FMXH:</span>
                      <span className="bg-blue-100 px-2 py-1 rounded">8 AM ({activeMonth === 'february' ? '36' : '32'} check-ins)</span>
                    </li>
                    <li className="flex justify-between items-center">
                      <span className="font-medium">SIET:</span>
                      <span className="bg-yellow-100 px-2 py-1 rounded">10 PM ({activeMonth === 'february' ? '20' : '25'} check-ins)</span>
                    </li>
                    <li className="flex justify-between items-center">
                      <span className="font-medium">SVLD:</span>
                      <span className="bg-green-100 px-2 py-1 rounded">9 PM ({activeMonth === 'february' ? '13' : '18'} check-ins)</span>
                    </li>
                    <li className="flex justify-between items-center">
                      <span className="font-medium">FSEO:</span>
                      <span className="bg-orange-100 px-2 py-1 rounded">9-10 PM (6 each)</span>
                    </li>
                    <li className="flex justify-between items-center">
                      <span className="font-medium">TSVO:</span>
                      <span className="bg-purple-100 px-2 py-1 rounded">1-2 PM (4 each)</span>
                    </li>
                    <li className="flex justify-between items-center">
                      <span className="font-medium">AIBL:</span>
                      <span className="bg-indigo-100 px-2 py-1 rounded">1-2 PM (3 each)</span>
                    </li>
                    {activeMonth === 'february' ? (
                      <li className="flex justify-between items-center">
                        <span className="font-medium">NOED:</span>
                        <span className="bg-pink-100 px-2 py-1 rounded">9 PM (2 check-ins)</span>
                      </li>
                    ) : (
                      <li className="flex justify-between items-center">
                        <span className="font-medium">GMRL:</span>
                        <span className="bg-pink-100 px-2 py-1 rounded">1 PM (3 check-ins)</span>
                      </li>
                    )}
                  </ul>
                </div>
              </div>
              
              <div className="bg-white p-4 rounded-lg shadow">
                <h2 className="text-lg font-semibold mb-2">Time Pattern Insights</h2>
                <div className="text-sm">
                  {timeInsights[activeMonth].map((insight, index) => (
                    <p key={index} className="mb-2">• {insight}</p>
                  ))}
                </div>
              </div>
            </div>
          )}
          
          {/* Weekly Analysis Tab */}
          {activeTab === 'weekly' && (
            <div>
              <div className="bg-white p-4 rounded-lg shadow mb-4">
                <h2 className="text-lg font-semibold mb-2">Weekly Check-in Totals</h2>
                <ResponsiveContainer width="100%" height={300}>
                  <BarChart data={weeklyCheckIns}>
                    <CartesianGrid strokeDasharray="3 3" />
                    <XAxis dataKey="week" />
                    <YAxis />
                    <Tooltip />
                    <Legend />
                    <Bar dataKey="total" fill="#8884d8" />
                  </BarChart>
                </ResponsiveContainer>
              </div>
              
              <div className="bg-white p-4 rounded-lg shadow mb-4">
                <h2 className="text-lg font-semibold mb-2">Weekly Check-ins by Carrier</h2>
                <ResponsiveContainer width="100%" height={400}>
                  <BarChart data={weeklyByCarrier}>
                    <CartesianGrid strokeDasharray="3 3" />
                    <XAxis dataKey="week" />
                    <YAxis />
                    <Tooltip />
                    <Legend />
                    <Bar dataKey="FMXH" fill="#0088FE" />
                    <Bar dataKey="SVLD" fill="#00C49F" />
                    <Bar dataKey="SIET" fill="#FFBB28" />
                    <Bar dataKey="FSEO" fill="#FF8042" />
                    <Bar dataKey="TSVO" fill="#8884d8" />
                    <Bar dataKey="AIBL" fill="#82ca9d" />
                    {activeMonth === 'february' ? 
                      <Bar dataKey="NOED" fill="#ffc658" /> : 
                      <Bar dataKey="GMRL" fill="#ffc658" />
                    }
                  </BarChart>
                </ResponsiveContainer>
              </div>
              
              <div className="bg-white p-4 rounded-lg shadow">
                <h2 className="text-lg font-semibold mb-2">Weekly Trends Analysis</h2>
                <div className="text-sm space-y-2">
                  {weeklyTrends[activeMonth].map((trend, index) => (
                    <p key={index}>• <span className="font-semibold">{trend.split(':')[0]}:</span> {trend.includes(':') ? trend.split(':')[1] : trend}</p>
                  ))}
                </div>
              </div>
            </div>
          )}
          
          {/* Month Comparison Tab */}
          {activeTab === 'comparison' && (
            <div>
              <div className="bg-white p-4 rounded-lg shadow mb-4">
                <h2 className="text-lg font-semibold mb-2">Month-to-Month Comparison</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                  <div className="bg-blue-50 p-4 rounded-lg">
                    <h3 className="text-md font-semibold mb-2 text-blue-800">January 2025</h3>
                    <ul className="space-y-2">
                      <li className="flex justify-between">
                        <span>Total Check-ins:</span>
                        <span className="font-semibold">{keyStats.january.totalCheckIns}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Daily Average:</span>
                        <span className="font-semibold">{keyStats.january.dailyAverage}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Peak Day:</span>
                        <span className="font-semibold">{keyStats.january.peakDay}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Busiest Day of Week:</span>
                        <span className="font-semibold">{keyStats.january.busiestDay}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Top Carrier:</span>
                        <span className="font-semibold">FMXH (45%)</span>
                      </li>
                    </ul>
                  </div>
                  
                  <div className="bg-indigo-50 p-4 rounded-lg">
                    <h3 className="text-md font-semibold mb-2 text-indigo-800">February 2025</h3>
                    <ul className="space-y-2">
                      <li className="flex justify-between">
                        <span>Total Check-ins:</span>
                        <span className="font-semibold">{keyStats.february.totalCheckIns}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Daily Average:</span>
                        <span className="font-semibold">{keyStats.february.dailyAverage}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Peak Day:</span>
                        <span className="font-semibold">{keyStats.february.peakDay}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Busiest Day of Week:</span>
                        <span className="font-semibold">{keyStats.february.busiestDay}</span>
                      </li>
                      <li className="flex justify-between">
                        <span>Top Carrier:</span>
                        <span className="font-semibold">FMXH (41%)</span>
                      </li>
                    </ul>
                  </div>
                </div>
                
                <div className="mb-4">
                  <h3 className="text-md font-semibold mb-2">Carrier Distribution Comparison</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <ResponsiveContainer width="100%" height={250}>
                      <PieChart>
                        <Pie
                          data={janCarrierDistribution}
                          cx="50%"
                          cy="50%"
                          labelLine={false}
                          outerRadius={80}
                          fill="#8884d8"
                          dataKey="value"
                          label={({name, percent}) => `${name}: ${(percent * 100).toFixed(0)}%`}
                        >
                          {janCarrierDistribution.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                          ))}
                        </Pie>
                        <Tooltip />
                        <Legend />
                      </PieChart>
                    </ResponsiveContainer>
                    
                    <ResponsiveContainer width="100%" height={250}>
                      <PieChart>
                        <Pie
                          data={febCarrierDistribution}
                          cx="50%"
                          cy="50%"
                          labelLine={false}
                          outerRadius={80}
                          fill="#8884d8"
                          dataKey="value"
                          label={({name, percent}) => `${name}: ${(percent * 100).toFixed(0)}%`}
                        >
                          {febCarrierDistribution.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                          ))}
                        </Pie>
                        <Tooltip />
                        <Legend />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                </div>
                
                <div>
                  <h3 className="text-md font-semibold mb-2">Key Insights</h3>
                  <ul className="space-y-1">
                    {monthComparisonInsights.map((insight, index) => (
                      <li key={index} className="flex items-start">
                        <span className="text-indigo-600 mr-2">•</span>
                        <span>{insight}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };
    
    // Render the dashboard
    ReactDOM.render(<CheckInDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
